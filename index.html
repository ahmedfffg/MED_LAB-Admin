<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - معمل ميدلاب</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>معمل ميدلاب</h1>
    <h2>لوحة التحكم</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="admin@medlab.com">
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button type="submit" id="loginBtn">تسجيل الدخول</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
  </div>

  <script type="module">
    import { login, getSession } from './js/auth.js';

    async function initLoginPage() {
      const session = await getSession();
      if (session) {
        window.location.href = 'admin.html';
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';
        errorMsg.textContent = '';

        try {
          const { error } = await login(email, password);

          if (error) {
            errorMsg.textContent = 'بيانات الدخول غير صحيحة أو خدمة المصادقة غير متاحة';
            btn.disabled = false;
            btn.textContent = 'تسجيل الدخول';
            return;
          }

          window.location.href = 'admin.html';
        } catch (err) {
          console.error(err);
          errorMsg.textContent = 'حدث خطأ أثناء تسجيل الدخول';
          btn.disabled = false;
          btn.textContent = 'تسجيل الدخول';
        }
      });
    }

    initLoginPage();
  </script>
</body>
</html>
